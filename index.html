<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DotAdventure</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0d1019;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      /* Hide the browser context menu so right-click can be used in-game. */
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <!-- Phaser 4 (stable, from CDN — no build step required) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>

    <!-- Our game (ES modules). Requires being served over http:// (not file://). -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
